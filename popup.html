<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <img src="icons/icon48.png" alt="" class="logo">
      <div>
        <h1>Live Translate CC</h1>
        <p class="subtitle">Teams Caption Translator</p>
      </div>
      <label class="toggle" title="Enable / disable translation">
        <input type="checkbox" id="enabled" checked>
        <span class="toggle-slider"></span>
      </label>
    </header>

    <section class="section">
      <h2>Display</h2>
      <div class="field">
        <label for="displayMode">Mode</label>
        <select id="displayMode">
          <option value="inline">Inline (below captions)</option>
          <option value="sidepanel">Side Panel</option>
        </select>
      </div>
      <div class="field">
        <label for="fontSize">Font size</label>
        <div class="range-row">
          <input type="range" id="fontSize" min="10" max="20" value="13">
          <span id="fontSizeVal">13px</span>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Translation</h2>
      <div class="field">
        <label for="backend">Backend</label>
        <select id="backend">
          <option value="libre">LibreTranslate (free)</option>
          <option value="google">Google Cloud Translation</option>
          <option value="deepl">DeepL</option>
          <option value="openai">OpenAI (best for Québécois)</option>
        </select>
      </div>
      <div class="field" id="apiKeyField">
        <label for="apiKey">API Key</label>
        <input type="password" id="apiKey" placeholder="Enter API key…" autocomplete="off">
      </div>
      <div class="field" id="libreUrlField">
        <label for="libreUrl">LibreTranslate URL</label>
        <input type="url" id="libreUrl" placeholder="https://libretranslate.com">
      </div>
      <div class="field" id="openaiModelField">
        <label for="openaiModel">Model</label>
        <select id="openaiModel">
          <option value="gpt-4o-mini">gpt-4o-mini (fast, cheap)</option>
          <option value="gpt-4o">gpt-4o (best quality)</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
          <option value="gpt-4.1-nano">gpt-4.1-nano (fastest)</option>
        </select>
      </div>
      <div class="lang-row">
        <div class="field">
          <label for="sourceLang">From</label>
          <select id="sourceLang">
            <option value="fr" selected>French</option>
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
            <option value="nl">Dutch</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="ru">Russian</option>
          </select>
        </div>
        <span class="arrow">→</span>
        <div class="field">
          <label for="targetLang">To</label>
          <select id="targetLang">
            <option value="en" selected>English</option>
            <option value="fr">French</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
            <option value="nl">Dutch</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="ru">Russian</option>
          </select>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Export Transcript</h2>
      <div class="export-row">
        <select id="exportContent">
          <option value="both">Original + Translation</option>
          <option value="original">Original only</option>
          <option value="translated">Translated only</option>
        </select>
        <select id="exportFormat">
          <option value="txt">TXT</option>
          <option value="csv">CSV</option>
          <option value="srt">SRT</option>
        </select>
        <button id="exportBtn" type="button">Export</button>
      </div>
    </section>

    <section class="section">
      <h2>Saved Sessions</h2>
      <p class="session-hint">Transcripts persist across refreshes and browser restarts.</p>
      <div id="sessionList" class="session-list">
        <p class="session-empty">No saved sessions</p>
      </div>
      <button id="clearAllBtn" type="button" class="btn-danger btn-sm">Clear All Sessions</button>
    </section>

    <footer class="footer">
      <span class="shortcut">Alt+Shift+T</span> toggle mode
      <span class="sep">·</span>
      <span class="shortcut">Alt+Shift+E</span> export
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
